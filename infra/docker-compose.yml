# Ambiente de desenvolvimento local. Em produção, o banco é o Supabase.
name: zappi

services:
  banco:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zappi}
      POSTGRES_USER: ${POSTGRES_USER:-zappi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zappi_local}
    ports:
      # Acessível apenas pela própria máquina
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - banco_dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: maven:3.9-eclipse-temurin-21
    working_dir: /app
    command: mvn -B spring-boot:run
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://banco:5432/${POSTGRES_DB:-zappi}
      DB_USUARIO: ${POSTGRES_USER:-zappi}
      DB_SENHA: ${POSTGRES_PASSWORD:-zappi_local}
      # Hash da senha da Lídia para os dados iniciais (README, "Migrações do banco")
      LIDIA_SENHA_HASH: ${LIDIA_SENHA_HASH:-}
    ports:
      # Acessível apenas pela própria máquina
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    volumes:
      - ../backend:/app
      # Dependências do Maven e build ficam no contêiner, separados dos da máquina
      - backend_maven:/root/.m2
      - backend_target:/app/target
    depends_on:
      banco:
        condition: service_healthy

  frontend:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_USAR_POLLING: "true"
      # O proxy do Vite repassa /api ao contêiner do backend
      API_LOCAL: http://backend:8080
    ports:
      # Acessível apenas pela própria máquina
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ../frontend:/app
      # node_modules fica no contêiner, separado do da máquina
      - frontend_node_modules:/app/node_modules

volumes:
  banco_dados:
  backend_maven:
  backend_target:
  frontend_node_modules:
