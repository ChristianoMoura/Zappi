# Ambiente de desenvolvimento local. Em produção, o banco é o Supabase.
name: zappi

services:
  banco:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zappi}
      POSTGRES_USER: ${POSTGRES_USER:-zappi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zappi_local}
    ports:
      # Acessível apenas pela própria máquina
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - banco_dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_USAR_POLLING: "true"
    ports:
      # Acessível apenas pela própria máquina
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ../frontend:/app
      # node_modules fica no contêiner, separado do da máquina
      - frontend_node_modules:/app/node_modules

volumes:
  banco_dados:
  frontend_node_modules:
