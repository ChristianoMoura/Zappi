# Configuração comum a todos os ambientes.
# Credenciais vêm só de variáveis de ambiente, nunca do código (ISO 27002 8.24).
spring:
  application:
    name: zappi-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USUARIO}
    password: ${DB_SENHA}
  flyway:
    placeholders:
      # Hash BCrypt da senha da Lídia, usado só pela V2 (dados iniciais). Fica numa
      # variável de ambiente, nunca no repositório. A V2 para com erro se ele faltar.
      "[lidia_senha_hash]": ${LIDIA_SENHA_HASH:}
  servlet:
    multipart:
      # Fotos dos produtos até 5 MB, o mesmo limite do bucket (ZAP-40).
      max-file-size: 5MB
      max-request-size: 6MB
  jpa:
    open-in-view: false
    hibernate:
      # As tabelas são criadas pelas migrações do Flyway (db/migration), nunca pelo Hibernate.
      # Na subida, o Hibernate só confere se as entidades batem com as tabelas.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  # O Render informa a porta pela variável PORT.
  port: ${PORT:8080}
  # Usa o IP do cliente repassado pelo proxy do Render (X-Forwarded-For) no log de
  # auditoria. O Tomcat só aceita esse cabeçalho vindo de endereços internos.
  forward-headers-strategy: native

zappi:
  cors:
    # Endereços do frontend que podem chamar a API, separados por vírgula
    # (no Render, o endereço do Static Site). Vazio: nenhuma origem liberada.
    origens-permitidas: ${CORS_ORIGENS:}
  jwt:
    # Chave de assinatura do token, em Base64 com 32 bytes ou mais (ISO 27002 8.24).
    # Vazia fora da produção: o backend gera uma chave aleatória a cada subida.
    chave: ${JWT_CHAVE:}
    # O token vale 8 horas, sem refresh token (decisão da ZAP-62).
    validade: 8h
  armazenamento:
    # Supabase Storage das fotos (ZAP-40). Vazio fora da produção: o envio de fotos
    # responde 503 e o resto funciona.
    url: ${SUPABASE_URL:}
    chave-secreta: ${SUPABASE_CHAVE_SECRETA:}
    bucket: produtos
    # Logo e capa do estabelecimento (ZAP-119), no mesmo projeto, com leitura pública.
    bucket-estabelecimento: estabelecimentos

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
