# Perfil "prod": Render + Supabase (seção 12 do context.md). Ativado pela imagem Docker.
# Banco, origens do CORS e porta vêm de variáveis de ambiente, nunca do código.
spring:
  datasource:
    hikari:
      # O session pooler gratuito do Supabase aceita poucas conexões por projeto.
      maximum-pool-size: ${DB_POOL_MAXIMO:5}
      minimum-idle: 1
  flyway:
    # O schema public do Supabase já vem com objetos próprios (ex.: a função do RLS
    # automático), e o Flyway recusa um schema que não está vazio e não tem o histórico
    # dele. Com a linha de base na versão 0, ele cria o histórico e aplica todas as
    # migrações a partir da V1.
    baseline-on-migrate: true
    baseline-version: 0

zappi:
  jwt:
    # Em produção, a JWT_CHAVE é obrigatória: sem ela, o backend não sobe.
    chave-obrigatoria: true

server:
  # Ao reiniciar (deploy), termina as requisições em andamento antes de sair.
  shutdown: graceful
